<!doctype html>
<!-- PROTOTYPE — round 18 visual-world bake-off: "The Patch Bay". Throwaway. My Skills surface only.
     Opens by double-click (file://). Fixture data inline; all state in memory; no persistence. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Hub — Patch Bay prototype</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
/* ─── Tokens ─────────────────────────────────────────────────────────────────────────────
   One graticule: 4px base (Tailwind --spacing), 1U = 36px row. Every rail/header/row is a
   multiple of 4. Two neutral depths (ground = rack, face = panel). One cord colour. Three LEDs. */
@theme static {
  --color-*: initial;
  --color-ground: #0f1114;      /* rack ground: rails, gutters between panels */
  --color-face: #171a1f;        /* panel face: rows, inspector */
  --color-hover: #1d2127;       /* state: pointer over a row */
  --color-lift: #232830;        /* state: the row whose back is open in the inspector */
  --color-rule: #262b33;        /* hairline */
  --color-rule-strong: #353b45; /* control outlines */
  --color-ink: #e3e6eb;         /* primary text */
  --color-ink-2: #9ba2ad;       /* secondary text (6.4:1 on face) */
  --color-label: #8c939e;       /* engraved caps (5.5:1 on face) */
  --color-ash: #666d78;         /* unlit jack ring / inert (3.2:1 on face, non-text) */
  --color-cord: #a594ff;        /* the one cord colour: patched, selected, primary */
  --color-cord-ink: #0f1114;    /* text on cord */
  --color-ok: #3ddc84;
  --color-stale: #f5b400;
  --color-fault: #ff5d5d;
  --color-fault-ink: #0f1114;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  --text-label: 11px;  --text-label--line-height: 16px;   /* engraved caps only */
  --text-meta: 12px;   --text-meta--line-height: 16px;
  --text-body: 13px;   --text-body--line-height: 20px;
  --text-title: 15px;  --text-title--line-height: 20px;

  --spacing: 4px;
  --radius-ctl: 2px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

/* Light: the same rack in brushed aluminium — derived, not redesigned. Unlayered, so it wins. */
html[data-theme="light"] {
  --color-ground: #d8dce1;
  --color-face: #eef0f3;
  --color-hover: #e4e7eb;
  --color-lift: #dde1e6;
  --color-rule: #cdd2d8;
  --color-rule-strong: #b3bac3;
  --color-ink: #15181c;
  --color-ink-2: #4a515b;
  --color-label: #555c66;
  --color-ash: #7d848e;
  --color-cord: #5a44dc;
  --color-cord-ink: #ffffff;
  --color-ok: #188a4a;
  --color-stale: #a87800;
  --color-fault: #c62f2f;
  --color-fault-ink: #ffffff;
}

@layer base {
  html { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--color-ground); color: var(--color-ink);
    font-family: var(--font-sans); font-size: var(--text-body); line-height: var(--text-body--line-height);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  ::selection { background: color-mix(in oklab, var(--color-cord) 35%, transparent); color: var(--color-ink); }
  input, button { font: inherit; color: inherit; }
  input { caret-color: var(--color-cord); }
  input[type="checkbox"] { accent-color: var(--color-cord); width: 14px; height: 14px; margin: 0; cursor: pointer; }
  * { scrollbar-color: var(--color-rule-strong) transparent; }
  code, .mono { font-family: var(--font-mono); font-size: var(--text-meta); }
  :focus-visible { outline: 2px solid var(--color-cord); outline-offset: -2px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
}

@layer components {
  /* ─ Frame ─ */
  .app { display: grid; grid-template-rows: 48px minmax(0, 1fr); height: 100vh; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 480px; min-height: 0; }
  .rackcol { display: grid; grid-template-rows: 40px minmax(0, 1fr) 28px; min-height: 0; position: relative; border-right: 1px solid var(--color-rule); }

  /* ─ Engraved label: the only place caps + tracking appear ─ */
  .eng { font-size: var(--text-label); line-height: var(--text-label--line-height); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-label); }

  /* ─ Top rail ─ */
  .rail { display: flex; align-items: center; gap: 16px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--color-rule); background: var(--color-ground); }
  .mark { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
  .tabs { display: flex; height: 48px; }
  .tab { height: 48px; padding: 0 12px; background: none; border: 0; color: var(--color-ink-2); cursor: pointer; font-weight: 500; }
  .tab:hover { color: var(--color-ink); }
  .tab[aria-selected="true"] { color: var(--color-ink); box-shadow: inset 0 -2px 0 var(--color-ink); }
  .search { flex: 1; max-width: 400px; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; background: var(--color-face); border: 1px solid var(--color-rule-strong); border-radius: var(--radius-ctl); color: var(--color-ink-2); }
  .search:focus-within { border-color: var(--color-cord); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--color-ink); }
  .search input::placeholder { color: var(--color-ink-2); }
  kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 4px; border: 1px solid var(--color-rule-strong); border-radius: var(--radius-ctl); color: var(--color-ink-2); }

  /* ─ Controls: one vocabulary ─ */
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border: 1px solid var(--color-rule-strong); border-radius: var(--radius-ctl); background: transparent; color: var(--color-ink); font-weight: 500; white-space: nowrap; cursor: pointer; }
  .btn:hover { background: var(--color-hover); }
  .btn:disabled { color: var(--color-ash); cursor: default; background: transparent; }
  .btn-ghost { border-color: transparent; }
  .btn-primary { background: var(--color-cord); border-color: var(--color-cord); color: var(--color-cord-ink); }
  .btn-primary:hover { background: color-mix(in oklab, var(--color-cord) 88%, var(--color-ink)); }
  .btn-danger { background: var(--color-fault); border-color: var(--color-fault); color: var(--color-fault-ink); }
  .btn-danger:hover { background: color-mix(in oklab, var(--color-fault) 88%, var(--color-ink)); }
  .ibtn { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: var(--radius-ctl); background: none; color: var(--color-ink-2); cursor: pointer; }
  .ibtn:hover { background: var(--color-hover); color: var(--color-ink); }
  .btn-link { background: none; border: 0; padding: 0; color: var(--color-ink); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--color-ash); cursor: pointer; }
  .btn-link:hover { text-decoration-color: var(--color-ink); }

  /* Bypass switch: a standard switch, neutral when on — the cord is reserved for connections. */
  .sw { position: relative; width: 28px; height: 16px; flex: none; border-radius: 8px; border: 1px solid var(--color-ash); background: transparent; cursor: pointer; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--color-ash); }
  .sw[aria-checked="true"] { background: var(--color-ink-2); border-color: var(--color-ink-2); }
  .sw[aria-checked="true"]::after { transform: translateX(12px); background: var(--color-face); }

  /* Segmented filter control — squared, never pills */
  .seg { display: flex; height: 28px; border: 1px solid var(--color-rule-strong); border-radius: var(--radius-ctl); }
  .seg > button { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: none; color: var(--color-ink-2); cursor: pointer; font-weight: 500; }
  .seg > button + button { border-left: 1px solid var(--color-rule-strong); }
  .seg > button:hover { color: var(--color-ink); background: var(--color-hover); }
  .seg > button[aria-pressed="true"] { color: var(--color-ink); background: var(--color-lift); }
  .seg .n { color: var(--color-ink-2); }
  .seg > button[aria-pressed="true"] .n { color: var(--color-ink); }

  /* ─ LEDs (state only) and jacks (connections) ─ */
  .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .led.ok { background: var(--color-ok); } .led.stale { background: var(--color-stale); } .led.faulted { background: var(--color-fault); }
  .led.off { box-shadow: inset 0 0 0 1px var(--color-ash); }

  .jk { position: relative; display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px var(--color-ash); color: var(--color-cord); }
  .jk::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; opacity: 0; transition: opacity 100ms var(--ease-out); }
  .jk.patched::after, .jk.stale::after, .jk.faulted::after { opacity: 1; }
  .jk.stale { color: var(--color-stale); }
  .jk.faulted { color: var(--color-fault); }
  .strip { display: inline-flex; gap: 4px; }

  /* ─ Filter bar ─ */
  .fbar { display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--color-rule); background: var(--color-ground); min-width: 0; }
  .issues { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; color: var(--color-ink-2); min-width: 0; }
  .issues b { color: var(--color-ink); font-weight: 500; }

  /* ─ The rack ─ */
  .rack { overflow: auto; min-height: 0; background: var(--color-ground); outline: none; }
  .rack.has-bulk { padding-bottom: 48px; }
  .grid-cols { display: grid; grid-template-columns: 36px 200px minmax(0, 1fr) 128px 96px 48px 36px; align-items: center; }
  .flat .grid-cols { grid-template-columns: 36px 200px minmax(0, 1fr) 176px 128px 96px 48px 36px; }
  .grid-cols > * { min-width: 0; padding: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid-cols > .c-check, .grid-cols > .c-more { padding: 0; display: grid; place-items: center; }
  .grid-cols > .c-sync { padding: 0 8px; display: flex; align-items: center; gap: 8px; }
  .grid-cols > .c-on { padding: 0; display: grid; place-items: center; }

  .colhead { position: sticky; top: 0; z-index: 3; height: 28px; background: var(--color-ground); border-bottom: 1px solid var(--color-rule); }
  .panel { margin-top: 4px; background: var(--color-face); border-top: 1px solid var(--color-rule); border-bottom: 1px solid var(--color-rule); }
  .panel:first-of-type { margin-top: 0; border-top: 0; }
  .phead { position: sticky; top: 28px; z-index: 2; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; align-items: center; height: 36px; padding-right: 8px; background: var(--color-face); border-bottom: 1px solid var(--color-rule); cursor: default; }
  .phead .c-check { display: grid; place-items: center; }
  .pname { display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 4px; }
  .pname .chev { color: var(--color-ink-2); }
  .pname strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pname .count { color: var(--color-ink-2); }
  .psum { display: flex; align-items: center; gap: 12px; padding: 0 12px; color: var(--color-ink-2); white-space: nowrap; }
  .psum span { display: inline-flex; align-items: center; gap: 4px; }
  .phead.collapsed { border-bottom-color: transparent; }

  .row { height: 36px; border-bottom: 1px solid var(--color-rule); background: var(--color-face); cursor: default; scroll-margin-top: 64px; scroll-margin-bottom: 56px; }
  .panel .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--color-hover); }
  .row.open { background: var(--color-lift); }
  .row[aria-selected="true"] { background: color-mix(in oklab, var(--color-cord) 13%, var(--color-face)); }
  .row[aria-selected="true"]:hover { background: color-mix(in oklab, var(--color-cord) 17%, var(--color-face)); }
  .row .nm { font-weight: 500; }
  .row.open .nm { font-weight: 600; }
  .row .c-name { display: flex; align-items: center; gap: 8px; }
  .row .c-name .nm { overflow: hidden; text-overflow: ellipsis; }
  .row .edit-mark { color: var(--color-ink-2); display: inline-flex; }
  .row .edit-mark svg.i { width: 12px; height: 12px; }
  .row .c-desc { color: var(--color-ink-2); }
  .row .src { font-family: var(--font-mono); font-size: var(--text-meta); color: var(--color-ink-2); margin-right: 8px; }
  .row .c-source { font-family: var(--font-mono); font-size: var(--text-meta); color: var(--color-ink-2); }
  .row .num { color: var(--color-ink); }
  .row .c-scope { color: var(--color-ink-2); }
  .row .c-scope b { color: var(--color-ink); font-weight: 500; }
  .row.bypassed .nm, .row.bypassed .num { color: var(--color-ink-2); }
  .row .c-more .ibtn { width: 24px; height: 24px; }
  @media (hover: hover) { .row .c-more .ibtn { opacity: 0; } .row:hover .c-more .ibtn, .row:focus-within .c-more .ibtn, .row.open .c-more .ibtn { opacity: 1; } }

  .empty { padding: 48px 24px; text-align: center; color: var(--color-ink-2); }
  .empty strong { display: block; color: var(--color-ink); font-weight: 600; margin-bottom: 4px; }

  /* ─ Rack foot + legend ─ */
  .foot { display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--color-rule); background: var(--color-ground); color: var(--color-ink-2); font-size: var(--text-meta); white-space: nowrap; overflow: hidden; }
  .foot .event { color: var(--color-ink); overflow: hidden; text-overflow: ellipsis; }
  .legend { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  /* ─ Bulk rail: rises from the foot ─ */
  .bulk { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--color-face); border-top: 1px solid var(--color-cord); visibility: hidden; pointer-events: none; }
  .bulk.up { visibility: visible; pointer-events: auto; }
  .bulk .count { font-weight: 600; margin-right: 8px; white-space: nowrap; }
  .bulk .hint { margin-left: auto; color: var(--color-ink-2); font-size: var(--text-meta); white-space: nowrap; display: flex; gap: 12px; align-items: center; }

  /* ─ Inspector: the panel's back ─ */
  .insp { background: var(--color-face); overflow: auto; min-height: 0; display: flex; flex-direction: column; }
  .insp-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-bottom: 1px solid var(--color-rule); }
  .insp-title { margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .insp-desc { margin: 4px 0 0; color: var(--color-ink-2); }
  .insp-head .tools { display: flex; align-items: center; gap: 4px; margin-left: auto; height: 20px; }
  .sec { border-bottom: 1px solid var(--color-rule); padding: 0 16px 16px; }
  .sec-h { display: flex; align-items: center; gap: 8px; height: 36px; }
  .sec-h .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .srcline { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 0 8px; border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-ground); }
  .srcline code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-ink); }
  .srcline .ibtn { width: 24px; height: 24px; }
  .health { display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .health .sub { color: var(--color-ink-2); }

  .jgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); user-select: none; touch-action: none; }
  .jcell { display: grid; grid-template-rows: 32px 32px; justify-items: center; align-items: center; padding: 0 2px; border: 0; background: var(--color-ground); cursor: pointer; }
  .jcell + .jcell { border-left: 1px solid var(--color-rule); }
  .jcell:hover { background: var(--color-hover); }
  .jcell:disabled { cursor: default; background: var(--color-ground); }
  .jcell .jl { align-self: end; font-size: var(--text-meta); line-height: 14px; color: var(--color-ink-2); text-align: center; overflow-wrap: anywhere; }
  .jcell.lit .jl { color: var(--color-ink); }
  .jack { position: relative; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--color-ash); color: var(--color-cord); }
  .jack::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: currentColor; opacity: 0; transition: opacity 100ms var(--ease-out); }
  .jack.patched, .jack.stale, .jack.faulted { box-shadow: inset 0 0 0 1px currentColor; }
  .jack.patched::after, .jack.stale::after, .jack.faulted::after { opacity: 1; }
  .jack.stale { color: var(--color-stale); }
  .jack.faulted { color: var(--color-fault); }
  .readout { margin-top: 8px; display: flex; align-items: center; gap: 8px; height: 20px; color: var(--color-ink-2); overflow: hidden; white-space: nowrap; }
  .readout code { overflow: hidden; text-overflow: ellipsis; color: var(--color-ink); }
  .faults { margin-top: 8px; border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); }
  .fault { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 8px 8px 8px 12px; }
  .fault + .fault { border-top: 1px solid var(--color-rule); }
  .fault .what b { font-weight: 600; }
  .fault .what code { color: var(--color-ink); }
  .fault .why { color: var(--color-ink-2); }
  .hintline { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--color-ink-2); font-size: var(--text-meta); }
  .hintline span { display: inline-flex; align-items: center; gap: 4px; }

  .prow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; height: 36px; border-bottom: 1px solid var(--color-rule); cursor: pointer; }
  .prow:last-child { border-bottom: 0; }
  .prow code { color: var(--color-ink-2); }
  .insp-foot { display: flex; gap: 8px; padding: 16px; }
  .insp-empty { padding: 48px 24px; color: var(--color-ink-2); text-align: center; }

  /* ─ Menus (fixed: escape the scroll container) ─ */
  .menu { position: fixed; z-index: 20; min-width: 200px; padding: 4px; background: var(--color-face); border: 1px solid var(--color-rule-strong); border-radius: var(--radius-ctl); box-shadow: 0 4px 12px rgb(0 0 0 / 0.35); }
  html[data-theme="light"] .menu { box-shadow: 0 4px 12px rgb(20 24 30 / 0.14); }
  .menu[hidden] { display: none; }
  .menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-ctl); background: none; color: var(--color-ink); text-align: left; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--color-hover); outline: none; }
  .menu hr { border: 0; border-top: 1px solid var(--color-rule); margin: 4px 0; }
  .menu .danger { color: var(--color-fault); }

  [hidden] { display: none !important; }
  .placeholder { display: grid; place-items: center; height: 100%; padding: 24px; color: var(--color-ink-2); text-align: center; background: var(--color-ground); }
  .placeholder strong { display: block; color: var(--color-ink); margin-bottom: 4px; }

  /* ─ The one structural collapse: below 1200px the inspector becomes a sheet ─ */
  @media (max-width: 1199px) {
    .body { grid-template-columns: minmax(0, 1fr); }
    .rackcol { border-right: 0; }
    .insp { position: fixed; top: 48px; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 10; border-left: 1px solid var(--color-rule-strong); box-shadow: -12px 0 32px rgb(0 0 0 / 0.35); visibility: hidden; }
    html[data-theme="light"] .insp { box-shadow: -12px 0 32px rgb(20 24 30 / 0.14); }
    .insp.sheet-open { visibility: visible; }
    .issues .long { display: none; }
  }
  @media (min-width: 1200px) { .sheet-only { display: none !important; } }
  @media (prefers-reduced-motion: reduce) {
    .jk::after, .jack::after { transition: none !important; }
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="rail">
    <div class="mark">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      Skills Hub
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
    <label class="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search skills, descriptions, sources" aria-label="Search skills" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <div class="flex items-center gap-1 ml-auto">

          <div class="pname" data-act="collapse">${ic(col ? 'chevR' : 'chevD', 'chev')}<strong>${esc(g.name)}</strong><span class="count">${countText}</span></div>

  const vis = visibleRows(), someSel = vis.some(s => st.selected.has(s.id)), allSel = vis.length && vis.every(s => st.selected.has(s.id));

}

/* ═════════════════════════ Render: bulk rail ═════════════════════════ */

function render() { renderTabs(); if (st.tab !== 'skills') return; renderFbar(); renderRack(); renderBulk(); renderInsp(); renderFoot(); }

/* ═════════════════════════ Mutations ═════════════════════════ */
function note(msg) { st.event = msg; }
function setTarget(s, tid, mode) {
  if (!s.enabled) return false;
  const cur = s.targets[tid];
  if (mode === 'patch' && cur === 'unpatched') { s.targets[tid] = 'patched'; return true; }
  if (mode === 'unpatch' && cur !== 'unpatched') { s.targets[tid] = 'unpatched'; delete s.faults[tid]; return true; }
  return false;
}
function deploy(list) {
  let n = 0; list.forEach(s => TOOLS.forEach(t => { if (setTarget(s, t.id, 'patch')) n++; }));
  const f = list.reduce((a, s) => a + (s.enabled ? tally(s).f : 0), 0);
  return `Patched ${n} target${n === 1 ? '' : 's'}${f ? ` · ${f} still faulted` : ''}`;
}
function openSkill(id, { focusInspector = false } = {}) {
  st.openId = id; st.readout = null;
  if (narrow.matches) st.sheetOpen = true;
  render();
  if (focusInspector || narrow.matches) { const j = $('#jgrid .jcell'); (j && !j.disabled ? j : $('#insp .sw')).focus(); }
}

/* ═════════════════════════ Rack interactions ═════════════════════════ */
const navItems = () => [...$('#rack').querySelectorAll('[data-nav]')];
function focusKey(key, { follow = true } = {}) {
  st.focusKey = key;
  const el = $('#rack').querySelector(`[data-key="${CSS.escape(key)}"]`);
  if (!el) return;
  $('#rack').querySelectorAll('[data-nav]').forEach(n => n.tabIndex = n === el ? 0 : -1);
  el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest' });
  // Wide layout: the inspector is the back of the focused row, so it follows focus.
  if (follow && el.dataset.id && !narrow.matches && st.openId !== el.dataset.id) {
    st.openId = el.dataset.id; st.readout = null;
    $('#rack').querySelectorAll('.row.open').forEach(r => r.classList.remove('open'));
    el.classList.add('open'); renderInsp();
  }
}
function toggleSelect(id) { st.selected.has(id) ? st.selected.delete(id) : st.selected.add(id); }
function toggleGroupSelect(name) {
  const g = groups().find(g => g.name === name); if (!g) return;
  const all = g.rows.every(s => st.selected.has(s.id));
  g.rows.forEach(s => all ? st.selected.delete(s.id) : st.selected.add(s.id));
}
function toggleCollapse(name) { st.collapsed.has(name) ? st.collapsed.delete(name) : st.collapsed.add(name); st.focusKey = 'g:' + name; }

$('#rack').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const nav = e.target.closest('[data-nav]');
  if (act === 'clear-filters') { st.filter = 'all'; st.q = ''; $('#q').value = ''; return render(); }
  if (act === 'select-all') { const vis = visibleRows(); const all = vis.every(s => st.selected.has(s.id)); vis.forEach(s => all ? st.selected.delete(s.id) : st.selected.add(s.id)); return render(); }
  if (!nav) return;
  st.focusKey = nav.dataset.key;
  const g = nav.dataset.group;
  if (g) {
    if (act === 'select-group') { toggleGroupSelect(g); return render(); }
    if (act === 'deploy') { note(`${g}: ` + deploy(groups().find(x => x.name === g).all)); return render(); }
    toggleCollapse(g); render(); return $('#rack').querySelector(`[data-key="${CSS.escape(st.focusKey)}"]`)?.focus({ preventScroll: true });
  }
  const s = byId(nav.dataset.id);
  if (act === 'select') { toggleSelect(s.id); render(); return nav.isConnected || $('#rack').querySelector(`[data-key="${CSS.escape(st.focusKey)}"]`)?.focus({ preventScroll: true }); }
  if (act === 'toggle') { s.enabled = !s.enabled; note(`${s.name} ${s.enabled ? 'enabled' : 'bypassed'}`); return render(); }
  if (act === 'menu') { return openRowMenu(s, e.target.closest('button')); }
  openSkill(s.id);
  $('#rack').querySelector(`[data-key="${CSS.escape(st.focusKey)}"]`)?.focus({ preventScroll: true });
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  const typing = tag === 'INPUT' && e.target.type !== 'checkbox' || tag === 'TEXTAREA';
  if (!$('#menu').hidden) return menuKeys(e);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (typing) { if (e.key === 'Escape') { e.target.blur(); focusKey(st.focusKey || navItems()[0]?.dataset.key, { follow: false }); } if (e.key === 'ArrowDown') { e.preventDefault(); focusKey(st.focusKey || navItems()[0]?.dataset.key); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.key === 'Escape') {
    if (st.confirmDelete) { st.confirmDelete = false; return renderBulk(); }
    if (st.sheetOpen) { st.sheetOpen = false; renderInsp(); return focusKey(st.focusKey, { follow: false }); }
    if (st.selected.size) { st.selected.clear(); return render(); }
    return;
  }
  const inRack = $('#rack').contains(e.target) || e.target === document.body;
  if (!inRack) return;
  const items = navItems(); if (!items.length) return;
  let idx = items.findIndex(n => n.dataset.key === st.focusKey);
  const cur = items[idx];
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); return focusKey(items[Math.min(items.length - 1, idx + 1)].dataset.key); }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); return focusKey(items[Math.max(0, idx - 1)].dataset.key); }
  if (e.key === 'Home') { e.preventDefault(); return focusKey(items[0].dataset.key); }
  if (e.key === 'End') { e.preventDefault(); return focusKey(items[items.length - 1].dataset.key); }
  if (!cur) return;
  if (cur.dataset.group) {
    const g = cur.dataset.group;
    if (e.key === 'Enter' || (e.key === 'ArrowLeft' && !st.collapsed.has(g)) || (e.key === 'ArrowRight' && st.collapsed.has(g))) { e.preventDefault(); toggleCollapse(g); return render(); }
    if (e.key === 'x' || e.key === ' ') { e.preventDefault(); toggleGroupSelect(g); return render(); }
    return;
  }
  const s = byId(cur.dataset.id);
  if (e.key === 'x' || e.key === ' ') { e.preventDefault(); toggleSelect(s.id); return render(); }
  if (e.key === 'Enter') { e.preventDefault(); return openSkill(s.id, { focusInspector: true }); }
  if (e.key === 'ArrowLeft' && st.view === 'grouped') { e.preventDefault(); return focusKey('g:' + groupOf(s)); }
});

/* ═════════════════════════ Filter bar, rail ═════════════════════════ */
$('#fbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.filter) st.filter = b.dataset.filter === st.filter && b.dataset.filter !== 'all' ? 'all' : b.dataset.filter;
  if (b.dataset.view) st.view = b.dataset.view;

});
$('#q').addEventListener('input', e => { st.q = e.target.value.trim(); render(); });
$('#theme').addEventListener('click', () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; renderTabs(); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  st.tab = b.dataset.tab;
  const on = st.tab === 'skills';
  $('#body').hidden = !on; $('#ph').hidden = on;
  if (!on) $('#ph-name').textContent = st.tab === 'explore' ? 'Explore' : 'Projects';

$('#ph-back').addEventListener('click', () => $('#tabs [data-tab="skills"]').click());
$('#refresh').addEventListener('click', () => { note('Refresh all: 60 sources checked · 3 stale'); renderFoot(); });
$('#add').addEventListener('click', () => { note('Add skill opens the add flow (not part of this prototype)'); renderFoot(); });

/* ═════════════════════════ Bulk rail ═════════════════════════ */
$('#bulk').addEventListener('click', e => {
  const b = e.target.closest('[data-bulk]'); if (!b) return;
  const sel = [...st.selected].map(byId), n = sel.length;
  switch (b.dataset.bulk) {
    case 'clear': st.selected.clear(); break;
    case 'sync': note(`${n} skills: ` + deploy(sel)); break;
    case 'assign': return openMenu(b, PROJECTS.map(p => ({ label: p.id, icon: 'folder', run: () => { sel.forEach(s => { if (!s.projects.includes(p.id)) s.projects.push(p.id); }); note(`Assigned ${n} skills to ${p.id}`); render(); } })));
    case 'disable': sel.forEach(s => s.enabled = false); note(`Bypassed ${n} skills`); break;
    case 'enable': sel.forEach(s => s.enabled = true); note(`Enabled ${n} skills`); break;
    case 'delete': st.confirmDelete = true; renderBulk(); return $('#bulk [data-bulk="cancel-delete"]').focus();
    case 'cancel-delete': st.confirmDelete = false; break;
    case 'delete-confirm':
      sel.forEach(s => SKILLS.splice(SKILLS.indexOf(s), 1));
      if (st.selected.has(st.openId)) st.openId = null;
      st.selected.clear(); st.confirmDelete = false; note(`Deleted ${n} skills and removed their targets`); break;
  }
  render();
});

/* ═════════════════════════ Inspector: jack grid (signature) ═════════════════════════ */
const insp = $('#insp');
let drag = null, lastJack = null;
function paintJack(cell, s) {
  const tid = cell.dataset.tool, js = jackState(s, tid);
  cell.classList.toggle('lit', js !== 'unpatched');
  cell.setAttribute('aria-pressed', js !== 'unpatched');
  cell.setAttribute('aria-label', `${TOOLS.find(t => t.id === tid).name}: ${STATE_WORD[js]}`);
  cell.querySelector('.jack').className = 'jack ' + js;
  $('#readout').innerHTML = readoutFor(s, tid); st.readout = { id: s.id, tool: tid };
}
function applyJack(cell, mode) {
  const s = byId(st.openId);
  if (setTarget(s, cell.dataset.tool, mode)) paintJack(cell, s);
}
function settleJacks(msg) { note(msg); renderRack(); renderFbar(); renderFoot(); /* inspector counts/faults refresh */
  const focusedTool = document.activeElement?.dataset?.tool; renderInsp();
  if (focusedTool) insp.querySelector(`.jcell[data-tool="${focusedTool}"]`)?.focus(); }
insp.addEventListener('pointerdown', e => {
  const cell = e.target.closest('.jcell'); if (!cell || cell.disabled || e.button !== 0) return;
  e.preventDefault(); cell.focus();
  const s = byId(st.openId), mode = s.targets[cell.dataset.tool] === 'unpatched' ? 'patch' : 'unpatch';
  if (e.shiftKey && lastJack != null) {
    const a = Math.min(lastJack, +cell.dataset.i), b = Math.max(lastJack, +cell.dataset.i);
    insp.querySelectorAll('.jcell').forEach(c => { if (+c.dataset.i >= a && +c.dataset.i <= b) applyJack(c, mode); });
    lastJack = +cell.dataset.i;
    return settleJacks(`${s.name}: ${mode === 'patch' ? 'patched' : 'unpatched'} ${b - a + 1} targets`);
  }
  drag = { mode, visited: new Set([cell.dataset.tool]), s };
  applyJack(cell, mode); lastJack = +cell.dataset.i;
  $('#jgrid').setPointerCapture(e.pointerId);
});
insp.addEventListener('pointermove', e => {
  const cell = document.elementFromPoint(e.clientX, e.clientY)?.closest?.('.jcell');
  if (!drag) { if (cell && !cell.disabled) { const s = byId(st.openId); $('#readout').innerHTML = readoutFor(s, cell.dataset.tool); } return; }
  if (!cell || cell.disabled || drag.visited.has(cell.dataset.tool)) return;
  drag.visited.add(cell.dataset.tool); applyJack(cell, drag.mode); lastJack = +cell.dataset.i;
});
const endDrag = () => { if (!drag) return; const { mode, visited, s } = drag; drag = null;
  settleJacks(`${s.name}: ${mode === 'patch' ? 'patched' : 'pulled'} ${[...visited].map(t => TOOLS.find(x => x.id === t).name).join(', ')}`); };
insp.addEventListener('pointerup', endDrag);
insp.addEventListener('pointercancel', endDrag);
insp.addEventListener('focusin', e => { const c = e.target.closest?.('.jcell'); if (c) { const s = byId(st.openId); $('#readout').innerHTML = readoutFor(s, c.dataset.tool); } });
insp.addEventListener('keydown', e => {
  const cell = e.target.closest('.jcell');
  if (!cell) return;
  const cells = [...insp.querySelectorAll('.jcell')], i = cells.indexOf(cell);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const n = cells[(i + (e.key === 'ArrowRight' ? 1 : -1) + cells.length) % cells.length];
    cells.forEach(c => c.tabIndex = c === n ? 0 : -1); n.focus();
  }
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); const s = byId(st.openId), tid = cell.dataset.tool;
    const mode = s.targets[tid] === 'unpatched' ? 'patch' : 'unpatch';
    applyJack(cell, mode); lastJack = i;
    settleJacks(`${s.name}: ${mode === 'patch' ? 'patched' : 'pulled'} ${TOOLS[i].name}`);
  }
});
insp.addEventListener('click', e => {
  const b = e.target.closest('[data-iact]'); if (!b) return;
  const s = byId(st.openId); if (!s) return;
  switch (b.dataset.iact) {
    case 'toggle': s.enabled = !s.enabled; note(`${s.name} ${s.enabled ? 'enabled' : 'bypassed'}`); render(); return insp.querySelector('.sw').focus();
    case 'close': st.sheetOpen = false; renderInsp(); return focusKey(st.focusKey, { follow: false });
    case 'menu': return openRowMenu(s, b);
    case 'copy': navigator.clipboard?.writeText(SOURCES[s.source].line(s.name)).catch(() => {}); b.innerHTML = ic('check'); setTimeout(() => { b.innerHTML = ic('copy'); }, 1200); return;
    case 'update': s.stale = false; note(`${s.name} updated to the upstream revision · edits replayed`); break;
    case 'patch-all': note(`${s.name}: ` + deploy([s])); break;
    case 'unpatch-all': TOOLS.forEach(t => setTarget(s, t.id, 'unpatch')); note(`${s.name}: every target pulled`); break;
    case 'fix': {
      const tid = b.dataset.tool, code = s.faults[tid], name = TOOLS.find(t => t.id === tid).name;
      if (code === 'TARGET_EXISTS') { s.targets[tid] = 'patched'; delete s.faults[tid]; note(`${s.name}: overwrote the existing folder in ${name}`); }
      else note(`${s.name}: ${name} is still not writable. Check permissions on ${TOOLS.find(t => t.id === tid).dir}`);
      break;
    }
    case 'project': {
      const pid = b.dataset.project;
      s.projects = b.checked ? [...s.projects, pid] : s.projects.filter(x => x !== pid);
      note(`${s.name} ${b.checked ? 'assigned to' : 'removed from'} ${pid}`);
      renderRack(); renderFoot(); return;
    }
    case 'edit': note(`Edit ${s.name}: opens the editor (not part of this prototype)`); renderFoot(); return;
    case 'repoint': note(`Re-point ${s.name}: opens the source picker (not part of this prototype)`); renderFoot(); return;
  }
  render();
});

/* ═════════════════════════ Menus ═════════════════════════ */
let menuReturn = null;
function openMenu(anchor, items) {
  const m = $('#menu');
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button type="button" role="menuitem" data-i="${i}" class="${it.danger ? 'danger' : ''}">${ic(it.icon)}${esc(it.label)}</button>`).join('');
  m.hidden = false;
  const r = anchor.getBoundingClientRect(), mr = m.getBoundingClientRect();
  const top = r.bottom + 4 + mr.height > innerHeight ? r.top - 4 - mr.height : r.bottom + 4;
  m.style.top = top + 'px'; m.style.left = Math.max(8, Math.min(innerWidth - mr.width - 8, r.right - mr.width)) + 'px';
  menuReturn = anchor; m._items = items;
  m.querySelector('button').focus();
}
function closeMenu() { $('#menu').hidden = true; if (menuReturn?.isConnected) menuReturn.focus(); else focusKey(st.focusKey, { follow: false }); menuReturn = null; }
function menuKeys(e) {
  const btns = [...$('#menu').querySelectorAll('button')], i = btns.indexOf(document.activeElement);
  if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); return closeMenu(); }
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
  if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
}
$('#menu').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const it = $('#menu')._items[+b.dataset.i]; $('#menu').hidden = true; menuReturn = null; it.run(); });
document.addEventListener('pointerdown', e => { if (!$('#menu').hidden && !e.target.closest('#menu')) closeMenu(); });
function openRowMenu(s, anchor) {
  openMenu(anchor, [
    ...(s.stale && s.enabled ? [{ label: 'Update from upstream', icon: 'update', run: () => { s.stale = false; note(`${s.name} updated · edits replayed`); render(); } }] : []),
    { label: 'Open inspector', icon: 'panels', run: () => openSkill(s.id, { focusInspector: true }) },
    { label: 'Edit', icon: 'pencil', run: () => { note(`Edit ${s.name}: opens the editor (not part of this prototype)`); renderFoot(); } },
    { label: 'Re-point source', icon: 'link', run: () => { note(`Re-point ${s.name} (not part of this prototype)`); renderFoot(); } },
    { label: 'Copy source', icon: 'copy', run: () => { navigator.clipboard?.writeText(SOURCES[s.source].line(s.name)).catch(() => {}); note('Source copied'); renderFoot(); } },
    '-',
    { label: 'Delete…', icon: 'trash', danger: true, run: () => { st.selected = new Set([s.id]); st.confirmDelete = true; render(); $('#bulk [data-bulk="cancel-delete"]').focus(); } },
  ]);
}

narrow.addEventListener('change', () => { if (!narrow.matches) st.sheetOpen = false; render(); });

/* ═════════════════════════ Boot ═════════════════════════ */
st.openId = SKILLS.find(s => s.name === 'zod-schema-first').id;
st.focusKey = 'r:' + st.openId;
render();
</script>
