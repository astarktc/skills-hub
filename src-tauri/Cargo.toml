[package]
name = "app"
version = "1.3.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = "https://github.com/astarktc/skills-hub"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["test"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
anyhow = "1.0"
rusqlite = { version = "0.39", features = ["bundled"] }
dirs = "6.0"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
git2 = { version = "0.21", features = ["vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
junction = "1.1"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
# OS credential store for the GitHub token (core/credentials.rs). Default `v1` feature =
# macOS Keychain, Windows Credential Manager, Linux Secret Service over zbus (pure Rust).
keyring = "4.2"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

# Move Library folder's relocation fidelity (core/library_move.rs): extended
# attributes on Unix (`libc` for the ENOTSUP of a volume without them), and a
# file's physical identity (volume serial + file index, link count) on
# Windows. All three were already in the lock file.
[target.'cfg(unix)'.dependencies]
xattr = "1.6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
# A named data stream is content the relocation copy cannot verify
# (`FindFirstStreamW`); the version winapi-util already brings in.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
filetime = "0.2"
