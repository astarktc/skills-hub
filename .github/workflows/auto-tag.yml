name: Auto-tag on version bump

on:
  push:
    branches: [main]
    paths:
      - package.json

# Single-job workflow: `contents: write` pushes the tag and `actions: write`
# dispatches release.yml, so the top-level grant is the job's grant.
permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    # Skip if the push was just a tag (avoid loops)
    if: "!contains(github.event.head_commit.message, '[skip-tag]')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # This job `git push`es the tag with the default GITHUB_TOKEN, which
          # checkout stores in the local git config — keep the credentials.
          persist-credentials: true

      - name: Extract version from package.json
        id: ver
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create and push tag if it doesn't exist
        run: |
          git fetch --tags
          TAG="${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            # Tags pushed with GITHUB_TOKEN do not trigger the Release
            # workflow's push event — dispatch it explicitly instead.
            gh workflow run release.yml --ref "$TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
