name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Build jobs only compile and upload workflow artifacts; the one job that
# publishes the GitHub Release (assemble-updater-json) escalates to
# `contents: write` at job level.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      # macOS signing (BACKLOG #120, docs/macos-code-signing.md): the operator's Apple personal team and the bundle
      # identifier the designated requirement pins. Changing either resets every macOS privacy grant and Keychain
      # approval once on every Mac.
      MACOS_TEAM_ID: N66437Y9GD
      MACOS_BUNDLE_ID: com.skillshub.app
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel (x86_64) — cross-compiled on the arm64 image. macos-14 was retired by
          # GitHub on 2026-11-02 (1.3.2's first release run refused it); macOS steps key on
          # runner.os, so the next image retirement is a change to these two lines only.
          - os: macos-15
            target: x86_64-apple-darwin
            arch: x86_64
          # macOS Apple Silicon (arm64)
          - os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          # Windows x64 (Intel/AMD)
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
          # Windows on Arm (aarch64)
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            arch: arm64
          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (master, 2026-09-12)
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          brew install pkg-config cmake

      - name: Install Windows build deps
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -euxo pipefail
          # Install Strawberry Perl for OpenSSL build (required by openssl-sys)
          choco install -y strawberryperl
          # Add Strawberry Perl to PATH
          export PATH="/c/Strawberry/perl/bin:$PATH"

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Prepare Tauri signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const raw = (process.env.RAW_KEY || '').trim();
          if (!raw) {
            console.warn('⚠️ 未配置 TAURI_SIGNING_PRIVATE_KEY，将生成未签名版本');
            process.exit(0);
          }

          const looksLikeBase64 = (s) => /^[A-Za-z0-9+/=]+$/.test(s);
          const startsWithUntrusted = (s) => s.split(/\r?\n/)[0].startsWith('untrusted comment:');

          let normalized = '';
          if (startsWithUntrusted(raw)) {
            normalized = raw.endsWith('\n') ? raw : raw + '\n';
          } else if (looksLikeBase64(raw)) {
            try {
              const decoded = Buffer.from(raw, 'base64').toString('utf8');
              if (startsWithUntrusted(decoded.trim())) {
                normalized = decoded.trimEnd() + '\n';
              } else {
                normalized = `untrusted comment: tauri signing key\n${raw.replace(/\s+/g, '')}\n`;
              }
            } catch {
              normalized = `untrusted comment: tauri signing key\n${raw.replace(/\s+/g, '')}\n`;
            }
          } else {
            try {
              const decoded = Buffer.from(raw, 'base64').toString('utf8');
              if (startsWithUntrusted(decoded.trim())) {
                normalized = decoded.trimEnd() + '\n';
              } else {
                throw new Error('not minisign');
              }
            } catch {
              console.error('❌ TAURI_SIGNING_PRIVATE_KEY 格式无法识别（不是两行原文/其 base64/单行 base64）');
              process.exit(1);
            }
          }

          const keyB64 = Buffer.from(normalized, 'utf8').toString('base64');
          const envFile = process.env.GITHUB_ENV;
          fs.appendFileSync(envFile, `TAURI_SIGNING_PRIVATE_KEY=${keyB64}\n`);

          const pwd = (process.env.RAW_PASSWORD || '').trim();
          if (pwd) fs.appendFileSync(envFile, `TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${pwd}\n`);
          NODE

      - name: Import Apple certificate (codesign)
        # Fails closed: a macOS release is never built without the team identity. One ad-hoc or otherwise-signed
        # release would reset every user's privacy grants and Keychain approvals (BACKLOG #120). The APPLE_* values
        # stay scoped to this step: with APPLE_CERTIFICATE in its environment, Tauri's bundler would build a keychain
        # of its own and pick the identity from `find-identity -v` itself.
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_INPUT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Apple's WWDR G3 intermediate, which issues Apple Development certificates. Without it in the keychain
          # `find-identity -v` lists no valid identity and codesign fails with errSecInternalComponent.
          WWDR_G3_URL: https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          WWDR_G3_SHA256: dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f
        run: |
          set -euo pipefail

          missing=""
          [ -n "${APPLE_CERTIFICATE:-}" ] || missing="$missing APPLE_CERTIFICATE"
          [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "${APPLE_SIGNING_IDENTITY_INPUT:-}" ] || missing="$missing APPLE_SIGNING_IDENTITY"
          if [ -n "$missing" ]; then
            echo "ERROR: missing secrets:$missing. A macOS release is never built unsigned (docs/macos-code-signing.md)." >&2
            exit 1
          fi
          IDENTITY="$(printf '%s' "$APPLE_SIGNING_IDENTITY_INPUT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if ! [[ "$IDENTITY" =~ ^[0-9A-F]{40}$ ]]; then
            echo "ERROR: APPLE_SIGNING_IDENTITY must be the certificate's 40-hex SHA-1." >&2
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          WWDR_PATH="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          # The build keychain lives only for this job; its password never needs to be known outside it.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          curl -fsSL --retry 3 -o "$WWDR_PATH" "$WWDR_G3_URL"
          echo "$WWDR_G3_SHA256  $WWDR_PATH" | shasum -a 256 -c -

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$WWDR_PATH" -k "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          echo "Valid codesigning identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "$IDENTITY"; then
            echo "ERROR: $IDENTITY is not a valid codesigning identity in the build keychain (expired, revoked, not the" >&2
            echo "imported certificate, or its chain to Apple's root is incomplete)." >&2
            exit 1
          fi

          # The certificate must be the team's, and it must not be about to lapse (renewal: docs/macos-code-signing.md).
          CERT_PEM="$(security find-certificate -a -Z -p "$KEYCHAIN_PATH" | awk -v id="$IDENTITY" '
            /^SHA-1 hash:/ { keep = ($3 == id) } keep && /BEGIN CERTIFICATE/,/END CERTIFICATE/ { if (keep) print }')"
          SUBJECT="$(printf '%s\n' "$CERT_PEM" | openssl x509 -noout -subject -nameopt sep_multiline)"
          if ! printf '%s\n' "$SUBJECT" | grep -Eq "^[[:space:]]*OU=${MACOS_TEAM_ID}[[:space:]]*$"; then
            echo "ERROR: certificate $IDENTITY does not belong to team $MACOS_TEAM_ID." >&2
            exit 1
          fi
          if ! printf '%s\n' "$CERT_PEM" | openssl x509 -noout -checkend 0 > /dev/null; then
            echo "ERROR: certificate $IDENTITY has expired. Re-issue it in Xcode and update the secrets." >&2
            exit 1
          fi
          if ! printf '%s\n' "$CERT_PEM" | openssl x509 -noout -checkend $((30 * 24 * 3600)) > /dev/null; then
            echo "::warning::The macOS signing certificate expires within 30 days ($(printf '%s\n' "$CERT_PEM" | openssl x509 -noout -enddate)). Re-issue it in Xcode and update the secrets (docs/macos-code-signing.md)."
          fi

          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          # The codesign shim adds the team designated requirement when Tauri signs the app bundle.
          echo "$GITHUB_WORKSPACE/scripts/macos-codesign" >> "$GITHUB_PATH"

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        # updater 产物（*.tar.gz/*.sig）是基于 .app bundle 生成的，因此必须包含 app
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Building Tauri App for macOS ==="
          echo "Target: ${{ matrix.target }}"
          echo "Arch: ${{ matrix.arch }}"
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "ERROR: APPLE_SIGNING_IDENTITY is not set; a macOS release is never built unsigned." >&2
            exit 1
          fi
          if [ "$(command -v codesign)" != "$GITHUB_WORKSPACE/scripts/macos-codesign/codesign" ]; then
            echo "ERROR: the codesign shim is not first on PATH; the app would lack the team requirement." >&2
            exit 1
          fi
          echo "Signing with $APPLE_SIGNING_IDENTITY (team $MACOS_TEAM_ID)"
          # Step 1: compile + bundle the .app (the expensive part; updater *.tar.gz/*.sig derive from it).
          npm run tauri:build -- --target ${{ matrix.target }} --bundles app
          # Step 2: the DMG. Tauri's bundle_dmg.sh (hdiutil create/attach/detach) flakes
          # intermittently on GitHub macOS runners (hdiutil "Resource busy" racing Spotlight/
          # XProtect, DiskArbitration detach timeouts — actions/runner-images#7522,
          # tauri-action#801). v1.2.1 x86_64 failed this way while aarch64 passed on the same
          # image. Retry the cheap DMG-only step; --verbose surfaces the script's real stderr.
          DMG_ATTEMPTS=3
          for attempt in $(seq 1 "$DMG_ATTEMPTS"); do
            echo "=== DMG bundle attempt ${attempt}/${DMG_ATTEMPTS} ==="
            if npm run tauri:build -- --target ${{ matrix.target }} --bundles dmg --verbose; then
              break
            fi
            if [ "$attempt" -eq "$DMG_ATTEMPTS" ]; then
              echo "❌ DMG bundling failed after ${DMG_ATTEMPTS} attempts" >&2
              exit 1
            fi
            echo "⚠️ DMG bundling failed; retrying in 15s" >&2
            sleep 15
          done
          echo "=== Build completed ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ || true

      - name: Build Tauri App (Windows)
        if: matrix.os == 'windows-2022'
        # Windows: the NSIS installer only. No `--no-sign`: that flag also skips the *updater* signature
        # (`*-setup.exe.sig`), which left every Windows install unable to update in-app through 1.3.2. There is no
        # Authenticode certificate configured, so the bundler signs nothing else.
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Building Tauri App for Windows ==="
          echo "Target: ${{ matrix.target }}"
          echo "Arch: ${{ matrix.arch }}"
          # Add Strawberry Perl to PATH for OpenSSL build
          export PATH="/c/Strawberry/perl/bin:$PATH"
          npm run tauri:build -- --target ${{ matrix.target }} --bundles nsis
          echo "=== Build completed ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ || true

      - name: Build Tauri App (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Building Tauri App for Linux ==="
          echo "Target: ${{ matrix.target }}"
          echo "Arch: ${{ matrix.arch }}"
          npm run tauri:build -- --target ${{ matrix.target }} --bundles deb,appimage
          echo "=== Build completed ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ || true

      - name: Verify codesign
        # Both shipped apps must carry the team signature and the team designated requirement: the one inside the
        # updater archive (what an in-app update installs) and the one inside the DMG (a first install). The bundle
        # dir holds no .app by now: the DMG-only pass deletes the .app it built once the DMG exists.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BUNDLE="src-tauri/target/${TARGET}/release/bundle/macos"
          CONF_ID="$(node -p "require('./src-tauri/tauri.conf.json').identifier")"
          if [ "$CONF_ID" != "$MACOS_BUNDLE_ID" ]; then
            echo "ERROR: tauri.conf.json identifier ($CONF_ID) differs from MACOS_BUNDLE_ID ($MACOS_BUNDLE_ID)." >&2
            exit 1
          fi
          WANT="identifier \"$MACOS_BUNDLE_ID\" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.1] /* exists */ and certificate leaf[subject.OU] = $MACOS_TEAM_ID"

          check_app() {
            local app="$1"
            echo "=== $app"
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -E '^(Identifier|Format|Authority|TeamIdentifier|Runtime Version|CodeDirectory)' || true
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
            local team dr
            team="$(/usr/bin/codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            [ "$team" = "$MACOS_TEAM_ID" ] || { echo "ERROR: TeamIdentifier is '${team:-none}', not $MACOS_TEAM_ID" >&2; exit 1; }
            dr="$(/usr/bin/codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')"
            echo "designated => $dr"
            [ "$dr" = "$WANT" ] || { echo "ERROR: unexpected designated requirement" >&2; exit 1; }
            # The hardened runtime's library validation refuses any non-system dylib (e.g. a Homebrew libgit2).
            local foreign
            foreign="$(otool -L "$app/Contents/MacOS/"* | awk 'NR > 1 && $1 !~ /^(\/System\/Library\/|\/usr\/lib\/)/ && $1 !~ /:$/ { print $1 }')"
            [ -z "$foreign" ] || { echo "ERROR: the app links non-system libraries: $foreign" >&2; exit 1; }
          }

          TAR_GZ="$(find "$BUNDLE" -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1)"
          [ -n "$TAR_GZ" ] || { echo "ERROR: no updater archive in $BUNDLE" >&2; exit 1; }
          UNPACK="$RUNNER_TEMP/updater-check"
          rm -rf "$UNPACK" && mkdir -p "$UNPACK"
          tar -xzf "$TAR_GZ" -C "$UNPACK"
          UPDATER_APP="$(find "$UNPACK" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          [ -n "$UPDATER_APP" ] || { echo "ERROR: no .app inside $TAR_GZ" >&2; exit 1; }
          check_app "$UPDATER_APP"

          DMG="$(find "src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          [ -n "$DMG" ] || { echo "ERROR: no DMG in bundle/dmg" >&2; exit 1; }
          MOUNT="$RUNNER_TEMP/dmg-check"
          mkdir -p "$MOUNT"
          # hdiutil flakes on hosted runners (see the DMG build loop); retry the attach.
          for attempt in 1 2 3; do
            if hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$MOUNT" "$DMG" > /dev/null; then break; fi
            [ "$attempt" -lt 3 ] || { echo "ERROR: cannot attach $DMG" >&2; exit 1; }
            sleep 10
          done
          DMG_APP="$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          [ -n "$DMG_APP" ] || { echo "ERROR: no .app inside $DMG" >&2; hdiutil detach "$MOUNT" -force || true; exit 1; }
          check_app "$DMG_APP"
          hdiutil detach "$MOUNT" > /dev/null || hdiutil detach "$MOUNT" -force > /dev/null || true

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}" # e.g. v0.1.4
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"

          # 产物路径在不同 target 下可能不同：优先 target/<triple>/...，兜底 target/release/...
          BUNDLE_DIRS=(
            "src-tauri/target/${TARGET}/release/bundle"
            "src-tauri/target/release/bundle"
          )

          TAR_GZ=""
          DMG=""
          for dir in "${BUNDLE_DIRS[@]}"; do
            if [ -d "${dir}" ]; then
              if [ -z "${TAR_GZ}" ]; then
                TAR_GZ="$(find "${dir}" -type f -name "*.tar.gz" | head -n 1 || true)"
              fi
              if [ -z "${DMG}" ]; then
                DMG="$(find "${dir}" -type f -name "*.dmg" | head -n 1 || true)"
              fi
            fi
          done

          if [ -z "${TAR_GZ}" ]; then
            echo "❌ 未找到 *.tar.gz updater 产物（target=${TARGET}, arch=${ARCH}）。请确认 `src-tauri/tauri.conf.json` 已设置 `bundle.createUpdaterArtifacts=true`，且构建包含 `--bundles app`。" >&2
            for dir in "${BUNDLE_DIRS[@]}"; do
              echo "---- list: ${dir}" >&2
              ls -la "${dir}" 2>/dev/null || true
              find "${dir}" -maxdepth 6 -type f 2>/dev/null | head -n 200 >&2 || true
            done
            exit 1
          fi

          if [ ! -f "${TAR_GZ}.sig" ]; then
            echo "❌ 未找到 updater 签名文件：${TAR_GZ}.sig" >&2
            exit 1
          fi

          NEW_TAR_GZ="Skills-Hub-${VERSION}-macOS-${ARCH}.tar.gz"
          cp "${TAR_GZ}" "release-assets/${NEW_TAR_GZ}"
          cp "${TAR_GZ}.sig" "release-assets/${NEW_TAR_GZ}.sig"

          if [ -n "${DMG}" ]; then
            NEW_DMG="Skills-Hub-${VERSION}-macOS-${ARCH}.dmg"
            cp "${DMG}" "release-assets/${NEW_DMG}"
          else
            echo "⚠️ 未找到 macOS .dmg（可选）" >&2
          fi

      - name: Prepare Windows Assets
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}" # e.g. v0.1.4
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"

          # 产物路径在不同 target 下可能不同：优先 target/<triple>/...，兜底 target/release/...
          BUNDLE_DIRS=(
            "src-tauri/target/${TARGET}/release/bundle"
            "src-tauri/target/release/bundle"
          )

          EXE=""
          for dir in "${BUNDLE_DIRS[@]}"; do
            if [ -d "${dir}" ]; then
              if [ -z "${EXE}" ]; then
                EXE="$(find "${dir}" -type f -name "*-setup.exe" | head -n 1 || true)"
              fi
            fi
          done

          if [ -z "${EXE}" ]; then
            echo "❌ 未找到 *.exe 安装程序（target=${TARGET}, arch=${ARCH}）。请确认构建包含 `--bundles nsis`。" >&2
            for dir in "${BUNDLE_DIRS[@]}"; do
              echo "---- list: ${dir}" >&2
              ls -la "${dir}" 2>/dev/null || true
              find "${dir}" -maxdepth 6 -type f 2>/dev/null | head -n 200 >&2 || true
            done
            exit 1
          fi

          # The NSIS installer is also the Windows updater artifact (with its .sig)
          if [ ! -f "${EXE}.sig" ]; then
            echo "ERROR: No updater signature file: ${EXE}.sig" >&2
            exit 1
          fi

          NEW_EXE="Skills-Hub-${VERSION}-Windows-${ARCH}.exe"
          cp "${EXE}" "release-assets/${NEW_EXE}"
          cp "${EXE}.sig" "release-assets/${NEW_EXE}.sig"

      - name: Prepare Linux Assets
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"

          BUNDLE_DIRS=(
            "src-tauri/target/${TARGET}/release/bundle"
            "src-tauri/target/release/bundle"
          )

          DEB=""
          APPIMAGE=""
          for dir in "${BUNDLE_DIRS[@]}"; do
            if [ -d "${dir}" ]; then
              if [ -z "${DEB}" ]; then
                DEB="$(find "${dir}" -maxdepth 3 -type f -name "*.deb" | head -n 1 || true)"
              fi
              if [ -z "${APPIMAGE}" ]; then
                APPIMAGE="$(find "${dir}" -type f -name "*.AppImage" | head -n 1 || true)"
              fi
            fi
          done

          # AppImage is the updater artifact on Linux (with its .sig)
          if [ -z "${APPIMAGE}" ]; then
            echo "ERROR: No *.AppImage found (target=${TARGET}, arch=${ARCH})." >&2
            for dir in "${BUNDLE_DIRS[@]}"; do
              echo "---- list: ${dir}" >&2
              find "${dir}" -maxdepth 6 -type f 2>/dev/null | head -n 200 >&2 || true
            done
            exit 1
          fi

          if [ ! -f "${APPIMAGE}.sig" ]; then
            echo "ERROR: No updater signature file: ${APPIMAGE}.sig" >&2
            exit 1
          fi

          NEW_APPIMAGE="Skills-Hub-${VERSION}-Linux-${ARCH}.AppImage"
          cp "${APPIMAGE}" "release-assets/${NEW_APPIMAGE}"
          cp "${APPIMAGE}.sig" "release-assets/${NEW_APPIMAGE}.sig"

          if [ -n "${DEB}" ]; then
            NEW_DEB="Skills-Hub-${VERSION}-Linux-${ARCH}.deb"
            cp "${DEB}" "release-assets/${NEW_DEB}"
          fi

      - name: List prepared assets
        shell: bash
        run: ls -la release-assets || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  assemble-updater-json:
    name: Assemble updater.json
    # Pure bash + gh-release: needs no macOS. It ran on macos-14 until 1.3.0,
    # when GitHub refused it a hosted macOS runner three times in a row after
    # the five builds had finished ("not acquired by Runner of type hosted").
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dl
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate release notes from changelog
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/extract-changelog.mjs "$TAG" CHANGELOG.md > release-notes.md 2>/dev/null; then
            echo "Extracted release notes for $TAG from CHANGELOG.md"
          else
            echo "No CHANGELOG entry for $TAG — using default release notes"
            echo "Release $TAG" > release-notes.md
          fi
          {
            echo
            echo '**Windows Note:** Windows SmartScreen may show a warning during installation. This is normal for unsigned executables. The application is safe to use.'
            echo
            echo '**macOS Note:** macOS Gatekeeper workaround (only needed on some macOS versions): `xattr -cr "/Applications/Skills Hub.app"` (https://v2.tauri.app/distribute/#macos).'
          } >> release-notes.md

      - name: Generate updater.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          # Normalize to 3-part semver (e.g., "1.0" -> "1.0.0", "1" -> "1.0.0")
          IFS='.' read -ra parts <<< "$VERSION"
          while [ ${#parts[@]} -lt 3 ]; do
            parts+=("0")
          done
          VERSION="${parts[0]}.${parts[1]}.${parts[2]}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"

          mac_arm_url=""; mac_arm_sig=""
          mac_x64_url=""; mac_x64_sig=""
          linux_x64_url=""; linux_x64_sig=""
          win_x64_url=""; win_x64_sig=""
          win_arm_url=""; win_arm_sig=""

          ls -la dl || true

          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(tr -d '\r\n' < "$sig")
            case "$fname" in
              *-macOS-aarch64.tar.gz)
                mac_arm_url="$url"; mac_arm_sig="$sig_content";;
              *-macOS-x86_64.tar.gz)
                mac_x64_url="$url"; mac_x64_sig="$sig_content";;
              *-Linux-x86_64.AppImage)
                linux_x64_url="$url"; linux_x64_sig="$sig_content";;
              *-Windows-x64.exe)
                win_x64_url="$url"; win_x64_sig="$sig_content";;
              *-Windows-arm64.exe)
                win_arm_url="$url"; win_arm_sig="$sig_content";;
            esac
          done

          # Every shipped platform must be updatable: a missing one fails the release rather than publishing an
          # updater.json that strands those installs (Windows was missing through 1.3.2).
          missing=""
          [ -n "${mac_arm_url:-}" ] || missing="$missing darwin-aarch64"
          [ -n "${mac_x64_url:-}" ] || missing="$missing darwin-x86_64"
          [ -n "${linux_x64_url:-}" ] || missing="$missing linux-x86_64"
          [ -n "${win_x64_url:-}" ] || missing="$missing windows-x86_64"
          [ -n "${win_arm_url:-}" ] || missing="$missing windows-aarch64"
          if [ -n "$missing" ]; then
            echo "ERROR: no updater artifact + .sig for:$missing" >&2
            exit 1
          fi

          # Read release notes if available (generated in prior step or inline)
          NOTES_FILE="release-notes.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_CONTENT=$(cat "$NOTES_FILE")
          else
            NOTES_CONTENT="Release $TAG"
          fi
          # Escape for JSON: backslashes, double quotes, newlines
          NOTES_JSON=$(printf '%s' "$NOTES_CONTENT" | sed 's/\\/\\\\/g; s/"/\\"/g' | awk '{printf "%s\\n", $0}' | sed 's/\\n$//')

          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\","
            echo "  \"notes\": \"$NOTES_JSON\","
            echo "  \"pub_date\": \"$PUB_DATE\","
            echo '  "platforms": {'
            first=1
            if [ -n "${mac_arm_url:-}" ] && [ -n "${mac_arm_sig:-}" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"darwin-aarch64\": {\"signature\": \"$mac_arm_sig\", \"url\": \"$mac_arm_url\"}"
              first=0
            fi
            if [ -n "${mac_x64_url:-}" ] && [ -n "${mac_x64_sig:-}" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"darwin-x86_64\": {\"signature\": \"$mac_x64_sig\", \"url\": \"$mac_x64_url\"}"
              first=0
            fi
            if [ -n "${linux_x64_url:-}" ] && [ -n "${linux_x64_sig:-}" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-x86_64\": {\"signature\": \"$linux_x64_sig\", \"url\": \"$linux_x64_url\"}"
              first=0
            fi
            if [ -n "${win_x64_url:-}" ] && [ -n "${win_x64_sig:-}" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-x86_64\": {\"signature\": \"$win_x64_sig\", \"url\": \"$win_x64_url\"}"
              first=0
            fi
            if [ -n "${win_arm_url:-}" ] && [ -n "${win_arm_sig:-}" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-aarch64\": {\"signature\": \"$win_arm_sig\", \"url\": \"$win_arm_url\"}"
              first=0
            fi
            echo '  }'
            echo '}'
          } > "$tmp_json"

          cat "$tmp_json"
          mv "$tmp_json" updater.json

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Project Skills Hub ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            dl/*
            updater.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
