name: Update Featured Skills

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Single-job workflow: `contents: write` commits featured-skills.json back to
# main, so the top-level grant is the job's grant.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job `git push`es with the default GITHUB_TOKEN, which checkout
          # wires into the local git config (v6+: an included credentials file
          # under $RUNNER_TEMP) - keep the credentials.
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Fetch featured skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-featured-skills-v2.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add featured-skills.json
          git diff --cached --quiet || git commit -m "chore: update featured-skills.json"
          git push
