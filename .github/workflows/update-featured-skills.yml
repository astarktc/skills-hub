name: Update Featured Skills

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Single-job workflow: `contents: write` commits featured-skills.json back to
# main, so the top-level grant is the job's grant.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job `git push`es with the default GITHUB_TOKEN, which checkout
          # stores in the local git config - keep the credentials.
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Fetch featured skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-featured-skills-v2.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add featured-skills.json
          git diff --cached --quiet || git commit -m "chore: update featured-skills.json"
          git push
